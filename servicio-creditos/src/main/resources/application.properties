spring.application.name=servicio-creditos
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/creditos}
spring.datasource.username=${DB_USUARIO:creditos}
spring.datasource.password=${DB_CLAVE:creditos}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

servicios.clientes.url=${CLIENTES_URL:http://localhost:8082}
servicios.evaluacion.url=${EVALUACION_URL:http://localhost:8084}
creditos.reintento-ms=30000
creditos.reintento-antiguedad=PT30S

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=20s
resilience4j.timelimiter.configs.default.timeout-duration=4s

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [%X{correlationId:-}]
