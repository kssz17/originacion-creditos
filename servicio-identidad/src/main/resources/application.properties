spring.application.name=servicio-identidad
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identidad}
spring.datasource.username=${DB_USUARIO:identidad}
spring.datasource.password=${DB_CLAVE:identidad}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

jwt.secreto=${JWT_SECRETO}
jwt.duracion=PT30M

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
