spring.application.name=servicio-evaluacion
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evaluacion}
spring.datasource.username=${DB_USUARIO:evaluacion}
spring.datasource.password=${DB_CLAVE:evaluacion}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [%X{correlationId:-}]
